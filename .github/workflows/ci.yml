name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # The API (../api, ../lib) has its own dependencies; the browser tests run it in-process.
      - name: Install API dependencies
        run: npm ci
        working-directory: .

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Domain rules, dataset checks and API tests. The real-Blob integration test runs only when a
      # BLOB_READ_WRITE_TOKEN secret is configured (there is no Blob store yet), and skips otherwise.
      - name: Unit and API tests
        run: npm test
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (desktop and phone)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
